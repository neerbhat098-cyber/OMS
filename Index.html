<!DOCTYPE html>
<html>
<head>
    <title>OMS Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            height:100vh;
            font-family:'Segoe UI',sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:420px;
            background:white;
            border-radius:20px;
            padding:35px;
            box-shadow:
                0 20px 50px rgba(0,0,0,.25);
        }

        .logo{
            text-align:center;
            font-size:34px;
            font-weight:800;
            letter-spacing:3px;
            color:#0f172a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#64748b;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:12px;
            border:1px solid #dbe2ea;
            border-radius:10px;
            font-size:14px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-weight:600;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .loading{
            position:fixed;
            inset:0;
            background:rgba(15,23,42,.75);
            display:none;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            z-index:99999;
            color:white;
        }

        .spinner{
            width:60px;
            height:60px;
            border:5px solid rgba(255,255,255,.3);
            border-top:5px solid white;
            border-radius:50%;
            animation:spin .8s linear infinite;
            margin-bottom:15px;
        }

        @keyframes spin{
            from{transform:rotate(0deg);}
            to{transform:rotate(360deg);}
        }

    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">OMS</div>

    <div class="subtitle">
        Order Management System
    </div>

    <input
        id="email"
        type="email"
        placeholder="Email Address">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <button onclick="loginUser()">
        Login
    </button>

</div>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Please wait, signing in...</div>
</div>

</body>
</html>
